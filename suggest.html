    <style>
      :root {
        color-scheme: light;
        --yellow: #f8d7e2;
        --yellow-hover: #f2c3d3;
        --black: #0d0c22;
        --ink: #0d0c22;
        --ink-2: #5f5f6e;
        --edge: #e9b8c7;
        --bg: #fdf6f8;
        --white: #ffffff;
        --line: #f1dbe3;
        --sans: "Lato", "Helvetica Neue", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .masthead {
        background: var(--yellow);
        border-bottom: 1px solid var(--edge);
        padding: 28px 0;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 clamp(16px, 4vw, 32px);
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 1.25rem;
        font-weight: 900;
        text-decoration: none;
      }
      .mark img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid var(--white);
        object-fit: cover;
        background: var(--white);
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 22px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--white);
        color: var(--ink);
        text-decoration: none;
        font-size: 0.92rem;
        font-weight: 700;
        box-shadow: 0 1px 3px rgba(13, 12, 34, 0.08);
      }
      main.wrap {
        padding-top: 48px;
        padding-bottom: 72px;
      }
      .framed {
        position: relative;
        background: var(--white);
        border: 2px solid var(--black);
        border-radius: 20px;
        box-shadow: 6px 6px 0 var(--edge);
        padding: clamp(28px, 5vw, 44px);
      }
      .framed::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 2px dashed var(--edge);
        border-radius: 10px;
        pointer-events: none;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 26px;
        color: var(--ink-2);
      }
      form label {
        display: block;
        margin-bottom: 16px;
        font-size: 0.92rem;
        font-weight: 700;
      }
      form input,
      form textarea {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 12px 14px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-weight: 400;
      }
      form input:focus,
      form textarea:focus {
        outline: none;
        border-color: var(--black);
      }
      form textarea {
        resize: vertical;
      }
      .btn-suggest {
        padding: 13px 28px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: var(--yellow);
        color: var(--black);
        font: inherit;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        transition:
          background-color 0.2s,
          transform 0.2s;
      }
      .btn-suggest:hover {
        background: var(--yellow-hover);
        transform: translateY(-1px);
      }
      .btn-suggest:disabled {
        opacity: 0.6;
        cursor: default;
        transform: none;
      }
      .status {
        min-height: 1.4em;
        margin: 14px 0 0;
        font-weight: 700;
        color: var(--ink-2);
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--black);
        outline-offset: 3px;
      }
    </style>
  </head>

    <main class="wrap">
      <a class="back" href="index.html">← Back to the shop</a>
      <section class="framed">
        <h1>Suggest a cursor</h1>
        <p class="lead">Got an idea for a set? Send it over.</p>
        <form id="suggestForm">
          <label>
            Your idea
            <textarea name="idea" required maxlength="800" rows="5"></textarea>
          </label>
          <label>
            Name (optional)
            <input name="name" maxlength="60" autocomplete="nickname" />
          </label>
          <label>
            Reference link (optional)
            <input
              name="link"
              type="url"
              maxlength="300"
              placeholder="https://"
            />
          </label>
          <button class="btn-suggest" id="sendBtn" type="submit">
            Send suggestion
          </button>
          <p class="status" id="suggestStatus" role="status"></p>
        </form>
      </section>
    </main>

    <script>
      // Paste your Discord webhook URL here. Until it is set, sending is turned off.
      const WEBHOOK_URL =
        "https://ptb.discord.com/api/webhooks/1562718060203352064/f37G3yfmGR_BL6sTjtB4hDrX2M-emUGX9AIY6UXalB0wHaD9zf0icvcEe6mfalHxuupa";
      const form = document.getElementById("suggestForm");
      const status = document.getElementById("suggestStatus");
      const btn = document.getElementById("sendBtn");

      if (!WEBHOOK_URL) {
        btn.disabled = true;
        status.textContent =
          "Suggestions aren't connected yet. Check back soon.";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!WEBHOOK_URL) return;
        const idea = form.idea.value.trim();
        if (!idea) return;
        const lines = ["**New cursor suggestion**", idea];
        if (form.name.value.trim())
          lines.push("From: " + form.name.value.trim());
        if (form.link.value.trim())
          lines.push("Reference: " + form.link.value.trim());
        btn.disabled = true;
        status.textContent = "Sending...";
        try {
          const res = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              content: lines.join("\n").slice(0, 1900),
              allowed_mentions: { parse: [] },
            }),
          });
          if (!res.ok) throw new Error("status " + res.status);
          form.reset();
          status.textContent = "Thanks! Your suggestion was sent.";
        } catch (err) {
          status.textContent = "Couldn't send that. Try again later.";
        } finally {
          btn.disabled = false;
        }
      });
    </script>
