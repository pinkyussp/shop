<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Thank you · pinkyussp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --yellow: #f1e8d4;
        --yellow-hover: #e6d9bb;
        --black: #0d0c22;
        --ink-2: #5f5f6e;
        --bg: #fbf8f2;
        --white: #ffffff;
        --sans: "Lato", "Helvetica Neue", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        background-image: linear-gradient(
          to bottom,
          var(--yellow) 0,
          var(--yellow) 200px,
          transparent 200px
        );
        background-repeat: no-repeat;
        color: var(--black);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        padding: 28px 18px;
      }
      main {
        max-width: 460px;
        width: 100%;
        text-align: center;
        background: var(--white);
        border-radius: 20px;
        padding: 40px 32px 36px;
        box-shadow: 0 2px 10px rgba(13, 12, 34, 0.08);
        animation: rise 0.6s ease both;
      }
      .label {
        display: inline-block;
        font-size: 0.74rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: var(--yellow);
        border-radius: 999px;
        padding: 4px 12px;
        margin: 0 0 14px;
      }
      h1 {
        font-size: 2.3rem;
        font-weight: 900;
        line-height: 1.12;
        letter-spacing: -0.02em;
        margin: 0 0 14px;
      }
      p {
        color: var(--ink-2);
        line-height: 1.6;
        margin: 0 0 22px;
      }
      .order {
        background: var(--bg);
        border-radius: 10px;
        padding: 10px 14px;
        margin: 0 0 22px;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--black);
        word-break: break-all;
      }
      .order[hidden] {
        display: none;
      }
      .btn {
        border: 1px solid var(--edge);
        display: inline-block;
        background: var(--yellow);
        color: var(--black);
        padding: 13px 28px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 900;
        font-size: 1rem;
        transition:
          background-color 0.2s,
          transform 0.2s;
      }
      .btn:hover {
        background: var(--yellow-hover);
        transform: translateY(-1px);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Order confirmed</p>
      <h1>Thank you.</h1>
      <p>
        Check your email for your receipt and download link. If it doesn't
        arrive within a few minutes, check your spam folder.
      </p>
      <p class="order" id="order" hidden></p>
      <a class="btn" href="index.html">Back to the shop</a>
    </main>
    <script>
      const id = new URLSearchParams(location.search).get("checkout_id");
      if (id) {
        const el = document.getElementById("order");
        el.textContent = "Reference " + id;
        el.hidden = false;
      }
    </script>
  </body>
</html>
