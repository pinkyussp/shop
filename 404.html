    <style>
      :root {
        color-scheme: light;
        --yellow: #f8d7e2;
        --yellow-hover: #f2c3d3;
        --black: #0d0c22;
        --ink: #0d0c22;
        --ink-2: #5f5f6e;
        --edge: #e9b8c7;
        --bg: #fdf6f8;
        --white: #ffffff;
        --line: #f1dbe3;
        --sans: "Lato", "Helvetica Neue", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .masthead {
        background: var(--yellow);
        border-bottom: 1px solid var(--edge);
        padding: 28px 0;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 clamp(16px, 4vw, 32px);
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 1.25rem;
        font-weight: 900;
        text-decoration: none;
      }
      .mark img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid var(--white);
        object-fit: cover;
        background: var(--white);
      }
      main.wrap {
        padding-top: 64px;
        padding-bottom: 72px;
      }
      .framed {
        position: relative;
        background: var(--white);
        border: 2px solid var(--black);
        border-radius: 20px;
        box-shadow: 6px 6px 0 var(--edge);
        padding: clamp(36px, 7vw, 56px) clamp(24px, 5vw, 44px);
        text-align: center;
      }
      .framed::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 2px dashed var(--edge);
        border-radius: 10px;
        pointer-events: none;
      }
      .code {
        display: inline-block;
        background: var(--black);
        color: var(--white);
        font-weight: 900;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        padding: 4px 12px;
        border-radius: 999px;
      }
      h1 {
        margin: 18px 0 10px;
        font-size: clamp(1.8rem, 5vw, 2.4rem);
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 auto 28px;
        max-width: 36ch;
        color: var(--ink-2);
        font-size: 1.02rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        min-height: 46px;
        padding: 0 26px;
        border: 1px solid var(--edge);
        border-radius: 10px;
        background: var(--yellow);
        color: var(--black);
        font-size: 1rem;
        font-weight: 900;
        text-decoration: none;
        transition:
          background-color 0.2s,
          transform 0.2s;
      }
      .btn:hover {
        background: var(--yellow-hover);
        transform: translateY(-1px);
      }
      a:focus-visible {
        outline: 3px solid var(--black);
        outline-offset: 3px;
        border-radius: 8px;
      }
    </style>
  </head>
