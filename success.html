<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Thank you · pinkyussp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #2e2a27;
        --ink-2: #776d66;
        --bg: #f4f0e8;
        --paper: #fbf9f4;
        --line: #dcd3c6;
        --accent: #a94d74;
        --accent-deep: #8c3b5d;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: "Figtree", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        padding: 28px 22px;
      }
      main {
        max-width: 460px;
        width: 100%;
        text-align: center;
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 52px 36px 44px;
        box-shadow: 0 24px 50px -30px rgba(46, 42, 39, 0.4);
        animation: rise 0.9s var(--ease) both;
      }
      .label {
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 16px;
      }
      h1 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 400;
        font-size: 2.8rem;
        line-height: 1;
        letter-spacing: -0.025em;
        margin: 0 0 18px;
      }
      p {
        color: var(--ink-2);
        line-height: 1.6;
        margin: 0 0 22px;
      }
      .order {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 12px 0;
        margin: 0 0 26px;
        font-size: 0.9rem;
        word-break: break-all;
      }
      .order[hidden] {
        display: none;
      }
      .btn {
        display: inline-block;
        background: var(--ink);
        color: var(--paper);
        padding: 14px 34px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        transition:
          background 0.3s var(--ease),
          transform 0.3s var(--ease);
      }
      .btn:hover {
        background: var(--accent);
        transform: translateY(-2px);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Order confirmed</p>
      <h1>Thank you.</h1>
      <p>
        Check your email for your receipt and download link. If it doesn't
        arrive within a few minutes, check your spam folder.
      </p>
      <p class="order" id="order" hidden></p>
      <a class="btn" href="index.html">Back to the shop</a>
    </main>
    <script>
      const id = new URLSearchParams(location.search).get("checkout_id");
      if (id) {
        const el = document.getElementById("order");
        el.textContent = "Reference " + id;
        el.hidden = false;
      }
    </script>
  </body>
</html>
