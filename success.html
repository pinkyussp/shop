<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you · pinkyussp</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1c1c1c;
    --paper: #ffffff;
    --soft: #f5f6f7;
    --muted: #6b6f74;
    --rule: #e6e8eb;
    --accent: #29abe0;
    --accent-hover: #1f97c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .box { max-width: 480px; width: 100%; text-align: center; }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--soft);
    border: 1px solid var(--rule);
    margin: 0 auto 18px;
    display: grid;
    place-items: center;
    font-size: 28px;
    color: var(--accent);
    font-weight: 700;
  }
  h1 { font-size: 1.6rem; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 10px; }
  .order {
    display: inline-block;
    background: var(--soft);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.88rem;
    color: var(--muted);
    margin: 10px 0 20px;
    word-break: break-all;
  }
  .order[hidden] { display: none; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #ffffff;
    border-radius: 6px;
    padding: 12px 24px;
    font-weight: 700;
    text-decoration: none;
    margin-top: 8px;
  }
  .btn:hover { background: var(--accent-hover); }
</style>
</head>
<body>
<main class="box">
  <div class="check">✓</div>
  <h1>Thank you for your purchase</h1>
  <p>Your order is confirmed. Check your email for your receipt and download link. If you don't see it within a few minutes, check your spam folder.</p>
  <p class="order" id="order" hidden></p>
  <div>
    <a class="btn" href="index.html">Back to shop</a>
  </div>
</main>
<script>
  const id = new URLSearchParams(location.search).get("checkout_id");
  if (id) {
    const el = document.getElementById("order");
    el.textContent = "Order reference: " + id;
    el.hidden = false;
  }
</script>
</body>
</html>
